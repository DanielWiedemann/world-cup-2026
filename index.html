<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>World Cup Schedule</title>
  <meta name="description" content="FIFA World Cup 2026 schedule in your local timezone." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0c5c3c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="World Cup" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="title-row">
      <h1>World Cup Schedule</h1>
      <div class="actions">
        <button id="search-btn" class="icon-btn" aria-label="Search teams" title="Search teams">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
          </svg>
        </button>
        <button id="notify" class="icon-btn" hidden aria-label="Enable notifications" title="Enable notifications">
          <svg class="bell-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <svg class="bell-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z"/>
            <circle cx="18" cy="6" r="4" fill="#ff5a5a" stroke="#0c5c3c" stroke-width="1.5"/>
          </svg>
        </button>
        <button id="refresh" class="icon-btn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="meta-row">
      <span id="tz-label" class="tz-label"></span>
      <span id="status" class="status"></span>
      <button id="predictions-chip" class="predictions-chip" hidden>🎯 <b id="predictions-points">0</b> pts</button>
    </div>
    <div id="search-bar" class="search-bar" hidden>
      <svg class="search-bar-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
      </svg>
      <input id="search-input" class="search-input" type="search" inputmode="search" autocomplete="off" placeholder="Search a team — e.g. Germany" />
      <button id="search-clear" class="search-clear" type="button" aria-label="Clear search">×</button>
    </div>
    <nav class="filters" role="tablist">
      <div class="filters-track">
        <span class="filter-indicator" aria-hidden="true"></span>
        <button class="filter active" data-filter="upcoming" role="tab">Upcoming</button>
        <button class="filter" data-filter="today" role="tab">Today</button>
        <button class="filter" data-filter="past" role="tab">Past</button>
        <button class="filter" data-filter="groups" role="tab">Groups</button>
        <button class="filter" data-filter="bracket" role="tab">Bracket</button>
        <button class="filter" data-filter="scorers" role="tab">Scorers</button>
        <button class="filter" data-filter="all" role="tab">All</button>
      </div>
    </nav>
  </header>

  <div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-icon">↻</span></div>

  <div id="next-banner" class="next-banner" hidden></div>

  <main id="matches" class="matches"></main>

  <dialog id="team-dialog" class="team-dialog" aria-labelledby="team-dialog-name">
    <button type="button" id="team-dialog-close" class="player-dialog-close" aria-label="Close">×</button>
    <div class="team-dialog-hero" id="team-dialog-hero">
      <img id="team-dialog-logo" class="team-dialog-logo" alt="" />
      <div class="team-dialog-id">
        <h2 id="team-dialog-name">—</h2>
        <p id="team-dialog-sub">—</p>
      </div>
    </div>
    <div class="team-dialog-body" id="team-dialog-body"></div>
  </dialog>

  <dialog id="predictions-dialog" class="prefs-dialog" aria-labelledby="predictions-title">
    <button type="button" id="predictions-close" class="player-dialog-close" aria-label="Close">×</button>
    <div class="prefs-body">
      <h2 id="predictions-title">🎯 Your predictions</h2>
      <div id="predictions-summary" class="pred-summary"></div>
      <div id="predictions-list" class="predictions-list"></div>
    </div>
  </dialog>

  <dialog id="player-dialog" class="player-dialog" aria-labelledby="player-dialog-name">
    <button type="button" id="player-dialog-close" class="player-dialog-close" aria-label="Close">×</button>
    <div class="player-dialog-photo-wrap">
      <img id="player-dialog-photo" alt="" />
    </div>
    <div class="player-dialog-info">
      <h2 id="player-dialog-name">—</h2>
      <p id="player-dialog-meta">—</p>
    </div>
  </dialog>

  <dialog id="prefs-dialog" class="prefs-dialog" aria-labelledby="prefs-title">
    <form method="dialog" id="prefs-form">
      <h2 id="prefs-title">Notifications</h2>
      <p class="prefs-sub" id="prefs-sub">Pick the moments you want to hear about.</p>
      <ul class="prefs-list">
        <li>
          <label>
            <span>
              <strong>Pre-game</strong>
              <small>30 minutes before kickoff</small>
            </span>
            <input type="checkbox" name="preGame" data-key="preGame" />
          </label>
        </li>
        <li>
          <label>
            <span>
              <strong>Game starting</strong>
              <small>The moment kickoff happens</small>
            </span>
            <input type="checkbox" name="kickoff" data-key="kickoff" />
          </label>
        </li>
        <li>
          <label>
            <span>
              <strong>Goal</strong>
              <small>Every time the score changes</small>
            </span>
            <input type="checkbox" name="goal" data-key="goal" />
          </label>
        </li>
        <li>
          <label>
            <span>
              <strong>Game ended</strong>
              <small>Full time, with the final score</small>
            </span>
            <input type="checkbox" name="final" data-key="final" />
          </label>
        </li>
        <li class="prefs-divider">
          <label>
            <span>
              <strong>Only specific teams</strong>
              <small>Otherwise you get every match</small>
            </span>
            <input type="checkbox" name="teamFilter" data-key="teamFilter" />
          </label>
          <div class="teams-picker" id="teams-picker" hidden>
            <div class="teams-actions">
              <button type="button" class="teams-action" data-team-action="all">All</button>
              <button type="button" class="teams-action" data-team-action="none">None</button>
              <span class="teams-count" id="teams-count">0 selected</span>
            </div>
            <div class="teams-grid" id="teams-grid"></div>
          </div>
        </li>
      </ul>
      <p class="prefs-status" id="prefs-status" aria-live="polite"></p>
      <menu class="prefs-actions">
        <button type="button" id="prefs-disable" class="ghost-btn" hidden>Turn off all</button>
        <span class="spacer"></span>
        <button type="button" id="prefs-cancel" class="ghost-btn">Cancel</button>
        <button type="submit" id="prefs-save" class="primary-btn">Enable</button>
      </menu>
    </form>
  </dialog>

  <footer class="app-footer">
    <span>Data: ESPN</span>
    <span id="updated"></span>
  </footer>

  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
